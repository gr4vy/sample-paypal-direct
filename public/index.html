<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Gr4vy + PayPal direct mode sample</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      :root {
        color-scheme: light dark;
        --bg: #ffffff;
        --fg: #111111;
        --muted-bg: #f5f5f5;
        --border: #dddddd;
        --ok-bg: #e6f4ea;
        --ok-fg: #0b3d1f;
        --err-bg: #fde8e8;
        --err-fg: #5a1414;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #121212;
          --fg: #e8e8e8;
          --muted-bg: #1e1e1e;
          --border: #2e2e2e;
          --ok-bg: #14361e;
          --ok-fg: #c5e8cf;
          --err-bg: #3a1717;
          --err-fg: #f4caca;
        }
      }
      body {
        font: 16px/1.4 system-ui, -apple-system, sans-serif;
        max-width: 480px;
        margin: 4rem auto;
        padding: 0 1rem;
        background: var(--bg);
        color: var(--fg);
      }
      h1 { font-size: 1.4rem; }
      .product {
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 1rem;
        margin-bottom: 1.5rem;
        background: var(--muted-bg);
      }
      .price { font-size: 1.2rem; font-weight: 600; }
      #paypal-button-container { margin-top: 1rem; min-height: 50px; }
      #status {
        margin-top: 1rem;
        padding: 0.75rem;
        border-radius: 6px;
        background: var(--muted-bg);
        color: var(--fg);
        white-space: pre-wrap;
        font-family: ui-monospace, SFMono-Regular, monospace;
        font-size: 0.9rem;
      }
      .ok { background: var(--ok-bg); color: var(--ok-fg); }
      .err { background: var(--err-bg); color: var(--err-fg); }
    </style>
  </head>
  <body>
    <h1>Gr4vy + PayPal direct mode</h1>
    <div class="product">
      <div>Sample item</div>
      <div class="price">$12.99 USD</div>
    </div>
    <div id="paypal-button-container"></div>
    <div id="status" hidden></div>

    <script>
      // -----------------------------------------------------------------
      // Gr4vy + PayPal direct integration on web
      //
      // The flow is:
      //   1. Server creates a PayPal transaction. Returns { transactionId,
      //      sessionToken }.
      //   2. Client POSTs the sessionToken to Gr4vy's session endpoint and
      //      gets back { orderId, clientId, currency, intent, fundingSource }
      //      plus a default_completion_url.
      //   3. Client loads paypal.com/sdk/js with the clientId, currency, and
      //      intent, then renders the PayPal Smart Button.
      //   4. On approval, the browser is sent to default_completion_url. That
      //      URL 303-redirects back to our page with the transaction result
      //      in the query string.
      //   5. On return, the page fetches the transaction status and shows it.
      // -----------------------------------------------------------------

      const statusEl = document.getElementById("status");
      const buttonContainer = document.getElementById("paypal-button-container");

      function setStatus(msg, kind) {
        statusEl.hidden = false;
        statusEl.textContent = msg;
        statusEl.className = kind || "";
      }

      // Step 1 — our server wraps the Gr4vy SDK's transactions.create.
      async function createTransaction() {
        const r = await fetch("/transactions", {
          method: "POST",
          headers: { "content-type": "application/json" },
          body: JSON.stringify({ amount: 1299, currency: "USD", country: "US" }),
        });
        if (!r.ok) throw new Error(`POST /transactions ${r.status}`);
        return r.json();
      }

      // Step 2 — the session endpoint is meant to be called from the frontend
      // and is auth'd by the short-lived sessionToken (no private key needed).
      async function fetchPayPalSession(apiUrl, transactionId, sessionToken) {
        const url =
          `${apiUrl}/transactions/${transactionId}/session` +
          `?token=${encodeURIComponent(sessionToken)}`;
        const r = await fetch(url, { method: "POST" });
        if (!r.ok) throw new Error(`session ${r.status}`);
        return r.json();
      }

      // Step 3 — inject the PayPal JS SDK with parameters from the session.
      // `intent` must match the order's intent (authorize/capture) or PayPal
      // refuses to render. `merchant-id` is only used in multi-party setups
      // and is omitted when the session returns it as null.
      function loadPayPalSdk({ clientId, currency, intent, merchantId }) {
        return new Promise((resolve, reject) => {
          const params = new URLSearchParams({ "client-id": clientId, currency });
          if (intent) params.set("intent", intent);
          if (merchantId) params.set("merchant-id", merchantId);

          const s = document.createElement("script");
          s.src = `https://www.paypal.com/sdk/js?${params.toString()}`;
          s.onload = resolve;
          s.onerror = () => reject(new Error("PayPal SDK failed to load"));
          document.head.appendChild(s);
        });
      }

      // The Gr4vy session reports fundingSource as the SDK constant *path*,
      // e.g. "paypal.FUNDING.PAYPAL". Convert it to the actual SDK constant.
      function resolveFundingSource(value) {
        if (typeof value === "string" && value.startsWith("paypal.FUNDING.")) {
          return window.paypal.FUNDING[value.split(".").pop()];
        }
        return value;
      }

      // Step 5 — display the final transaction status on return from PayPal.
      async function showFinalStatus(transactionId) {
        try {
          const r = await fetch(`/transactions/${transactionId}`);
          const tx = await r.json();
          setStatus(`Transaction ${tx.id}\nstatus: ${tx.status}`, "ok");
        } catch (e) {
          setStatus(`Completed, but failed to fetch status: ${e.message}`, "ok");
        }
      }

      // Entry point: branch on whether the URL has ?transaction_id, which
      // tells us the buyer just returned from PayPal via the completion URL.
      async function init() {
        const returnedTxId = new URLSearchParams(location.search).get("transaction_id");
        if (returnedTxId) {
          buttonContainer.hidden = true;
          setStatus(`Fetching transaction ${returnedTxId}...`);
          await showFinalStatus(returnedTxId);
          return;
        }

        await renderPayPalButton();
      }

      async function renderPayPalButton() {
        setStatus("Creating transaction...");
        try {
          // Step 1: server creates the Gr4vy transaction.
          const { transactionId, sessionToken } = await createTransaction();

          // Step 2: client exchanges the session token for PayPal session data.
          setStatus("Fetching PayPal session...");
          const { apiUrl } = await (await fetch("/config")).json();
          const session = await fetchPayPalSession(apiUrl, transactionId, sessionToken);
          const { orderId, clientId, currency, merchantId, intent, fundingSource } =
            session.session_data;
          const defaultCompletionUrl = session.default_completion_url;

          // Step 3: load the PayPal JS SDK.
          setStatus("Loading PayPal SDK...");
          await loadPayPalSdk({ clientId, currency, intent, merchantId });
          statusEl.hidden = true;

          // Step 4: render the Smart Button. On approve, navigate the buyer
          // to the completion URL — it 303-redirects back to our page with
          // ?transaction_id=...&transaction_status=... in the query string.
          window.paypal
            .Buttons({
              fundingSource: resolveFundingSource(fundingSource),
              createOrder: () => orderId,
              onApprove: () => {
                setStatus("Completing transaction...");
                window.location.assign(defaultCompletionUrl);
              },
              onCancel: () => setStatus("Cancelled by buyer.", "err"),
              onError: (err) =>
                setStatus(`PayPal error: ${err?.message || err}`, "err"),
            })
            .render(buttonContainer);
        } catch (err) {
          setStatus(`Error: ${err.message}`, "err");
        }
      }

      init();
    </script>
  </body>
</html>

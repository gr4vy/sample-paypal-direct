<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Gr4vy + PayPal standalone session sample</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      :root {
        color-scheme: light dark;
        --bg: #ffffff;
        --fg: #111111;
        --muted-bg: #f5f5f5;
        --border: #dddddd;
        --ok-bg: #e6f4ea;
        --ok-fg: #0b3d1f;
        --err-bg: #fde8e8;
        --err-fg: #5a1414;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #121212;
          --fg: #e8e8e8;
          --muted-bg: #1e1e1e;
          --border: #2e2e2e;
          --ok-bg: #14361e;
          --ok-fg: #c5e8cf;
          --err-bg: #3a1717;
          --err-fg: #f4caca;
        }
      }
      body {
        font: 16px/1.4 system-ui, -apple-system, sans-serif;
        max-width: 480px;
        margin: 4rem auto;
        padding: 0 1rem;
        background: var(--bg);
        color: var(--fg);
      }
      h1 { font-size: 1.4rem; }
      .product {
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 1rem;
        margin-bottom: 1.5rem;
        background: var(--muted-bg);
      }
      .price { font-size: 1.2rem; font-weight: 600; }
      #paypal-button-container { margin-top: 1rem; min-height: 50px; }
      #status {
        margin-top: 1rem;
        padding: 0.75rem;
        border-radius: 6px;
        background: var(--muted-bg);
        color: var(--fg);
        white-space: pre-wrap;
        font-family: ui-monospace, SFMono-Regular, monospace;
        font-size: 0.9rem;
      }
      .ok { background: var(--ok-bg); color: var(--ok-fg); }
      .err { background: var(--err-bg); color: var(--err-fg); }
    </style>
  </head>
  <body>
    <h1>Gr4vy + PayPal standalone session</h1>
    <div class="product">
      <div>Sample item</div>
      <div class="price">$12.99 USD</div>
    </div>
    <div id="paypal-button-container"></div>
    <div id="status" hidden></div>

    <script>
      // -----------------------------------------------------------------
      // Gr4vy + PayPal standalone session on web
      //
      // The defining feature: NO transaction is created to render the button.
      // A transaction (and PayPal order) is created lazily, only when the
      // buyer clicks, inside PayPal's createOrder callback.
      //
      //   1. Page load: fetch the standalone PayPal session from our server
      //      (which proxies POST /payment-services/{id}/sessions). Returns
      //      { clientId, merchantId, currency, intent, fundingSource } — no
      //      orderId, no transaction.
      //   2. Load paypal.com/sdk/js with the clientId/currency/intent and
      //      render the Smart Button. Still no transaction.
      //   3. On click, createOrder creates the Gr4vy transaction + PayPal
      //      order: POST /transactions, then POST the per-transaction session
      //      to get the orderId and default_completion_url. Returns orderId.
      //   4. On approval, the browser is sent to default_completion_url, which
      //      303-redirects back with the transaction result in the query
      //      string.
      //   5. On return, the page fetches the transaction status and shows it.
      // -----------------------------------------------------------------

      const statusEl = document.getElementById("status");
      const buttonContainer = document.getElementById("paypal-button-container");

      // The client chooses these — they are not part of the standalone session,
      // which only returns the clientId and merchantId. INTENT must match the
      // intent configured on your PayPal connection in Gr4vy (the connection
      // controls the PayPal order's intent). The spider sandbox connection is
      // set to authorize; change this to "capture" if your connection captures.
      const CURRENCY = "USD";
      const INTENT = "authorize";
      const FUNDING_SOURCE = "paypal.FUNDING.PAYPAL";

      function setStatus(msg, kind) {
        statusEl.hidden = false;
        statusEl.textContent = msg;
        statusEl.className = kind || "";
      }

      // Step 1 — fetch the standalone PayPal session. Our server proxies the
      // payment-service session endpoint (it needs a private-key-signed token,
      // so it can't be called from the browser). Returns { clientId,
      // merchantId } only — no transaction is created.
      async function fetchStandaloneSession() {
        const r = await fetch("/paypal-session");
        if (!r.ok) throw new Error(`GET /paypal-session ${r.status}`);
        return r.json();
      }

      // Step 2 — inject the PayPal JS SDK. `intent` must match the order's
      // intent (authorize/capture) or PayPal refuses to render. `merchant-id`
      // is only used in multi-party setups and is omitted when the session
      // returns it as null.
      function loadPayPalSdk({ clientId, currency, intent, merchantId }) {
        return new Promise((resolve, reject) => {
          const params = new URLSearchParams({ "client-id": clientId, currency });
          if (intent) params.set("intent", intent);
          if (merchantId) params.set("merchant-id", merchantId);

          const s = document.createElement("script");
          s.src = `https://www.paypal.com/sdk/js?${params.toString()}`;
          s.onload = resolve;
          s.onerror = () => reject(new Error("PayPal SDK failed to load"));
          document.head.appendChild(s);
        });
      }

      // The Gr4vy session reports fundingSource as the SDK constant *path*,
      // e.g. "paypal.FUNDING.PAYPAL". Convert it to the actual SDK constant.
      function resolveFundingSource(value) {
        if (typeof value === "string" && value.startsWith("paypal.FUNDING.")) {
          return window.paypal.FUNDING[value.split(".").pop()];
        }
        return value;
      }

      // Step 3 — create the transaction + PayPal order lazily, on click. This
      // is the only place a transaction is created. It returns the orderId
      // PayPal needs, and stashes the completion URL for onApprove.
      let defaultCompletionUrl = null;
      async function createOrderLazily() {
        // 3a. Server creates the Gr4vy transaction (needs the private key).
        const txRes = await fetch("/transactions", {
          method: "POST",
          headers: { "content-type": "application/json" },
          // Send the same intent we loaded the SDK with, so the PayPal order's
          // intent matches — otherwise PayPal rejects the order on click.
          body: JSON.stringify({
            amount: 1299,
            currency: CURRENCY,
            country: "US",
            intent: INTENT,
          }),
        });
        if (!txRes.ok) throw new Error(`POST /transactions ${txRes.status}`);
        const { transactionId, sessionToken } = await txRes.json();

        // 3b. Exchange the session token for the per-transaction session,
        // directly from the browser (auth'd by the short-lived token). This is
        // where the orderId and default_completion_url come from.
        const { apiUrl } = await (await fetch("/config")).json();
        const sessUrl =
          `${apiUrl}/transactions/${transactionId}/session` +
          `?token=${encodeURIComponent(sessionToken)}`;
        const sessRes = await fetch(sessUrl, { method: "POST" });
        if (!sessRes.ok) throw new Error(`session ${sessRes.status}`);
        const { session_data, default_completion_url } = await sessRes.json();

        defaultCompletionUrl = default_completion_url;
        return session_data.orderId;
      }

      // Step 5 — display the final transaction status on return from PayPal.
      async function showFinalStatus(transactionId) {
        try {
          const r = await fetch(`/transactions/${transactionId}`);
          const tx = await r.json();
          setStatus(`Transaction ${tx.id}\nstatus: ${tx.status}`, "ok");
        } catch (e) {
          setStatus(`Completed, but failed to fetch status: ${e.message}`, "ok");
        }
      }

      // Entry point: branch on whether the URL has ?transaction_id, which
      // tells us the buyer just returned from PayPal via the completion URL.
      async function init() {
        const returnedTxId = new URLSearchParams(location.search).get("transaction_id");
        if (returnedTxId) {
          buttonContainer.hidden = true;
          setStatus(`Fetching transaction ${returnedTxId}...`);
          await showFinalStatus(returnedTxId);
          return;
        }

        await renderPayPalButton();
      }

      async function renderPayPalButton() {
        try {
          // Step 1: fetch the standalone session — no transaction created.
          setStatus("Fetching PayPal session...");
          const { clientId, merchantId } = await fetchStandaloneSession();

          // Step 2: load the PayPal JS SDK and render — still no transaction.
          // currency and intent are our own choices, not from the session.
          setStatus("Loading PayPal SDK...");
          await loadPayPalSdk({
            clientId,
            currency: CURRENCY,
            intent: INTENT,
            merchantId,
          });
          statusEl.hidden = true;

          // Step 3/4: render the Smart Button. createOrder creates the
          // transaction + order on click; onApprove navigates the buyer to the
          // completion URL, which 303-redirects back to our page with
          // ?transaction_id=...&transaction_status=... in the query string.
          window.paypal
            .Buttons({
              fundingSource: resolveFundingSource(FUNDING_SOURCE),
              createOrder: async () => {
                setStatus("Creating order...");
                const orderId = await createOrderLazily();
                statusEl.hidden = true;
                return orderId;
              },
              onApprove: () => {
                setStatus("Completing transaction...");
                window.location.assign(defaultCompletionUrl);
              },
              onCancel: () => setStatus("Cancelled by buyer.", "err"),
              onError: (err) =>
                setStatus(`PayPal error: ${err?.message || err}`, "err"),
            })
            .render(buttonContainer);
        } catch (err) {
          setStatus(`Error: ${err.message}`, "err");
        }
      }

      init();
    </script>
  </body>
</html>
